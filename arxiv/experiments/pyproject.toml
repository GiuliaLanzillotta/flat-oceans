[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flat-oceans"
version = "0.1.0"
description = "Reproduce the experiments in Flat oceans: vast convex invariance at the end of training"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
resisc = ["pyarrow>=14"]

[project.scripts]
flatocean = "flatocean.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["flatocean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
